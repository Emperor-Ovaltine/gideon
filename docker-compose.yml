services:
  gideon-bot:
    build: .
    image: gideon-bot:latest
    container_name: gideon-bot
    env_file:
      - .env
    ports:
      - "${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"
    volumes:
      # The container runs as non-root (UID 1000). Make sure this host
      # directory is writable by UID 1000:  sudo chown -R 1000:1000 <dir>
      - /change/to/your/data/dir:/app/data
    restart: always # Optional: Add restart policy
